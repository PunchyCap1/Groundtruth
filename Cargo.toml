[package]
name = "Groundtruth"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.36.2"
anyhow = "1"
base64 = "0.22"
dotenvy = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
