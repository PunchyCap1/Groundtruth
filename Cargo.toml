[package]
name = "Groundtruth"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.36.2"
anyhow = "1"
dotenvy = "0.15"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = { version = "3", features = ["json"] }
rfd = "0.17.2"

# Optimize dependencies (egui, the renderer, serde) even in `cargo run`, so the debug
# build stays smooth. Our own code still compiles fast. `cargo run --release` is faster still.
[profile.dev.package."*"]
opt-level = 2
