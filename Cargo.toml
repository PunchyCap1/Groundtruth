[package]
name = "Groundtruth"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.36.2"
anyhow = "1"
base64 = "0.22"
dotenvy = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = { version = "3", features = ["json"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "multipart"] }
rfd = "0.17.2"
